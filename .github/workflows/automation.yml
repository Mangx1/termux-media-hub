name: Termux Media Hub

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  m3u8-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Make checkers executable
        run: |
          chmod +x scripts/m3u8-check.py
          chmod +x scripts/build-dashboard.py

      - name: Run M3U8 intelligence checker
        run: python3 scripts/m3u8-check.py

      - name: Build web dashboard
        run: python3 scripts/build-dashboard.py

      - name: Show M3U8 report
        run: cat output/m3u8-report.csv

      - name: Show dashboard files
        run: ls -lh public/index.html

      - name: Upload M3U8 report
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-health-report
          path: output/m3u8-report.csv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: m3u8-check
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
