name: Termux Media Hub

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  playlist-intelligence:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Make scripts executable
        run: |
          chmod +x scripts/check-playlist.py
          chmod +x scripts/retry-errors.py
          chmod +x scripts/final-report.py
          chmod +x scripts/build-dashboard.py

      - name: Read playlist URL
        id: playlist
        run: |
          URL=$(grep -v '^#' data/playlist-url.txt | grep -v '^$' | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Playlist: $URL"

      - name: Scan playlist
        run: |
          python3 scripts/check-playlist.py \
            "${{ steps.playlist.outputs.url }}"

      - name: Retry failed streams
        run: |
          python3 scripts/retry-errors.py

      - name: Build final report
        run: |
          python3 scripts/final-report.py

      - name: Build dashboard
        run: |
          python3 scripts/build-dashboard.py

      - name: Show final summary
        run: |
          echo "========================================"
          echo "       FINAL PLAYLIST REPORT"
          echo "========================================"
          cat output/final-summary.txt
          echo
          echo "Dashboard:"
          ls -lh public/index.html

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: playlist-final-report
          path: |
            output/playlist-report.csv
            output/retry-report.csv
            output/final-report.csv
            output/final-summary.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: playlist-intelligence
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
