name: Termux Media Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make health checker executable
        run: chmod +x scripts/url-health-check.sh

      - name: Run URL health checker
        run: ./scripts/url-health-check.sh

      - name: Show health report
        run: cat output/health-report.csv

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: url-health-report
          path: output/health-report.csv
