name: Termux Media Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  m3u8-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Make checker executable
        run: chmod +x scripts/m3u8-check.py

      - name: Run M3U8 checker
        run: python3 scripts/m3u8-check.py

      - name: Show M3U8 report
        run: cat output/m3u8-report.csv

      - name: Upload M3U8 report
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-health-report
          path: output/m3u8-report.csv
